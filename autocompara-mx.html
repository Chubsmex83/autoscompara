<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1A56DB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>AutoCompara MX – Compara vehículos en México</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1A56DB;--blue-dark:#1447C0;--blue-light:#EBF2FF;
  --gray:#F8F9FA;--gray2:#E9ECEF;--gray3:#DEE2E6;--gray4:#6C757D;--gray5:#343A40;
  --green:#16A34A;--green-bg:#DCFCE7;--red:#DC2626;--red-bg:#FEE2E2;--orange:#EA580C;
  --yellow:#D97706;--yellow-bg:#FEF3C7;
  --badge-sedan:#1A56DB;--badge-suv:#16A34A;--badge-pickup:#EA580C;
  --badge-hatchback:#7C3AED;--badge-minivan:#0891B2;--badge-electrico:#059669;
  --radius:12px;--shadow:0 2px 16px rgba(0,0,0,.09);
}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:#F0F4F8;color:var(--gray5);font-size:15px;line-height:1.5}

.header{background:linear-gradient(135deg,#0F2C6B 0%,var(--blue) 100%);color:#fff;padding:28px 24px 22px;text-align:center}
.header-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
.header-logo svg{width:36px;height:36px;fill:#fff}
.header h1{font-size:clamp(22px,4vw,32px);font-weight:800;letter-spacing:-0.5px}
.header h1 span{color:#60A5FA}
.header p{font-size:14px;opacity:.85;margin-top:4px}
.header small{display:block;font-size:11px;opacity:.6;margin-top:8px;border-top:1px solid rgba(255,255,255,.2);padding-top:8px}

.sticky-top{position:sticky;top:0;z-index:100;background:#F0F4F8}
.mini-bar{display:none;align-items:center;gap:6px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--gray3);flex-wrap:wrap}
.mini-bar.visible{display:flex}
.mini-chip{display:inline-flex;align-items:center;gap:4px;background:var(--blue-light);color:var(--blue);font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;white-space:nowrap}
.mini-chip .mini-remove{cursor:pointer;opacity:.7;font-size:12px;margin-left:2px;min-width:20px;min-height:20px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.mini-chip .mini-remove:hover{opacity:1}
.btn-edit-sel{border:1.5px solid var(--blue);background:#fff;color:var(--blue);font-family:inherit;font-size:12px;font-weight:600;padding:7px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;margin-left:auto;min-height:36px;-webkit-tap-highlight-color:transparent}
.btn-edit-sel:hover,.btn-edit-sel:active{background:var(--blue);color:#fff}
.slots-collapsed{display:none}
.cta-collapsed{display:none}

.filter-bar{background:#fff;border-bottom:1px solid var(--gray3);padding:8px 0;display:flex;flex-direction:column;gap:4px}
.filter-row{display:flex;align-items:center;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:4px 12px}
.filter-row::-webkit-scrollbar{display:none}
.filter-label{font-size:12px;font-weight:700;color:#000;white-space:nowrap;padding-right:8px;flex-shrink:0}
.filter-group{display:flex;align-items:center;gap:5px;flex-shrink:0}
.filter-btn{border:1.5px solid var(--gray3);background:#fff;color:var(--gray5);font-family:inherit;font-size:12px;font-weight:500;padding:6px 12px;border-radius:20px;cursor:pointer;transition:all .18s;min-height:34px;white-space:nowrap;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.filter-btn:hover{border-color:var(--blue);color:var(--blue)}
.filter-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}

.slots-section{padding:16px 16px 10px;max-width:1280px;margin:0 auto}
.slots-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.slots-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:360px){.slots-grid{grid-template-columns:1fr 1fr;gap:8px}}

.slot-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:visible;min-height:140px;transition:box-shadow .2s}
.slot-card:hover{box-shadow:0 4px 24px rgba(0,0,0,.13)}
.slot-controls{padding:12px}
.slot-search-wrap{position:relative}
.slot-search{width:100%;border:1.5px solid var(--gray3);border-radius:8px;padding:10px 10px 10px 32px;font-family:inherit;font-size:16px;outline:none;transition:border-color .2s;-webkit-appearance:none}
.slot-search:focus{border-color:var(--blue)}
.slot-search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--gray4);pointer-events:none;font-size:14px}
.slot-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1.5px solid var(--gray3);border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.18);z-index:500;max-height:260px;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.slot-dropdown.open{display:block}
.slot-opt{padding:11px 12px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--gray2);transition:background .15s;-webkit-tap-highlight-color:transparent}
.slot-opt:last-child{border-bottom:none}
.slot-opt:hover,.slot-opt:active{background:var(--blue-light)}
.slot-opt-brand{font-weight:600}
.slot-opt-price{font-size:11px;color:var(--gray4);float:right}
.slot-opt-badge{font-size:10px;padding:2px 7px;border-radius:10px;color:#fff;margin-left:6px;vertical-align:middle}

.slot-filled-card{display:flex;flex-direction:column}
.slot-img{height:140px;display:flex;align-items:center;justify-content:center;font-size:42px;position:relative;border-radius:var(--radius) var(--radius) 0 0;overflow:hidden}
.car-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0;opacity:0;transition:opacity .4s ease}
.car-photo.loaded{opacity:1}
.car-emoji{position:relative;z-index:1;transition:opacity .3s}
.comp-car-img{width:100%;height:90px;object-fit:cover;object-position:center;border-radius:6px 6px 0 0;margin:-16px -16px 10px -16px;width:calc(100% + 32px);opacity:0;transition:opacity .4s ease;display:block}
.comp-car-img.loaded{opacity:1}
.comp-car-emoji{font-size:28px;display:block;margin-bottom:8px;line-height:1}
.slot-img-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;padding:10px;background:linear-gradient(transparent 30%,rgba(0,0,0,.5))}
.slot-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px;color:#fff;text-transform:uppercase;letter-spacing:.4px}
.slot-info{padding:12px 14px}
.slot-brand{font-size:12px;font-weight:600;color:var(--gray4);text-transform:uppercase;letter-spacing:.5px}
.slot-name{font-size:16px;font-weight:700;line-height:1.2;margin:2px 0 4px}
.slot-trim{font-size:11px;color:var(--gray4);margin-bottom:6px}
.slot-price{font-size:18px;font-weight:800;color:var(--blue)}
.slot-reliability{font-size:11px;margin-top:4px;display:flex;align-items:center;gap:5px}
.slot-actions{display:flex;gap:8px;padding:0 14px 14px;border-radius:0 0 var(--radius) var(--radius)}
.btn-remove{flex:1;border:1.5px solid var(--gray3);background:#fff;color:var(--gray4);font-family:inherit;font-size:12px;font-weight:600;padding:9px 7px;border-radius:7px;cursor:pointer;transition:all .18s;min-height:40px;-webkit-tap-highlight-color:transparent}
.btn-remove:hover,.btn-remove:active{border-color:var(--red);color:var(--red)}

.cta-wrap{text-align:center;padding:12px 16px 16px;max-width:1280px;margin:0 auto}
.btn-compare{background:var(--blue);color:#fff;border:none;font-family:inherit;font-size:16px;font-weight:700;padding:16px 40px;border-radius:12px;cursor:pointer;transition:background .2s,transform .15s;box-shadow:0 4px 14px rgba(26,86,219,.35);min-height:52px;width:100%;max-width:400px;-webkit-tap-highlight-color:transparent}
.btn-compare:hover{background:var(--blue-dark);transform:translateY(-1px)}
.btn-compare:disabled{background:var(--gray3);color:var(--gray4);cursor:not-allowed;box-shadow:none;transform:none}

#comparison-section{padding:24px;max-width:1280px;margin:0 auto}
.comparison-header{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.comparison-header h2{font-size:22px;font-weight:800}
.comparison-subtitle{font-size:13px;color:var(--gray4);margin-top:2px}

.table-wrap{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.comp-table{border-collapse:collapse;width:100%}
.comp-table th,.comp-table td{padding:11px 16px;text-align:center;font-size:13px;border-bottom:1px solid var(--gray2);border-right:1px solid var(--gray2)}
.comp-table th:last-child,.comp-table td:last-child{border-right:none}
.comp-table tr:last-child td,.comp-table tr:last-child th{border-bottom:none}
.comp-table td.section-header{background:var(--blue);color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;padding:8px 16px;text-align:left;border-right:none}
.col-label{font-weight:600;color:var(--gray4);font-size:12px;background:var(--gray);text-align:left;white-space:nowrap;min-width:140px}
.col-vehicle{font-weight:500;text-align:center;min-width:150px}
.col-vehicle-header{text-align:center;background:var(--blue-light);padding:16px;min-width:150px}
.vehicle-col-name{font-weight:700;font-size:14px}
.vehicle-col-trim{font-size:11px;color:var(--gray4)}
.vehicle-col-price{font-size:16px;font-weight:800;color:var(--blue);margin-top:4px}
.best{background:var(--green-bg);color:var(--green);font-weight:700;border-radius:6px;padding:3px 8px}
.worst{background:var(--red-bg);color:var(--red);font-weight:600;border-radius:6px;padding:3px 8px}
.mid-warn{background:var(--yellow-bg);color:var(--yellow);font-weight:600;border-radius:6px;padding:3px 8px}
.tags{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.tag{font-size:11px;padding:3px 9px;border-radius:10px;background:var(--blue-light);color:var(--blue);font-weight:500}
.issue-tag{font-size:11px;padding:3px 9px;border-radius:10px;background:var(--red-bg);color:var(--red);font-weight:500}
.pros-list,.cons-list{list-style:none;display:flex;flex-direction:column;gap:4px;text-align:left}
.pros-list li::before{content:"✓ ";color:var(--green);font-weight:700}
.cons-list li::before{content:"✗ ";color:var(--red);font-weight:700}

.table-overflow{overflow-x:auto;-webkit-overflow-scrolling:touch;position:relative}
.table-scroll-hint{display:none;text-align:center;font-size:11px;color:var(--gray4);padding:6px;background:var(--gray2)}
@media(max-width:768px){.table-scroll-hint{display:block}}

.score-section{padding:24px;max-width:1280px;margin:0 auto}
.score-header{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.score-header h2{font-size:22px;font-weight:800}
.winner-card{background:linear-gradient(135deg,#0F2C6B,var(--blue));color:#fff;border-radius:var(--radius);padding:24px;margin-bottom:24px;display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.winner-trophy{font-size:52px;line-height:1}
.winner-content h3{font-size:20px;font-weight:800;margin-bottom:4px}
.winner-content .winner-sub{font-size:13px;opacity:.8;margin-bottom:10px}
.winner-content p{font-size:14px;opacity:.92;line-height:1.6;max-width:700px}
.use-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.use-tag{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:12px;font-weight:500;padding:4px 12px;border-radius:20px}
.score-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.score-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.score-card-name{font-size:16px;font-weight:700;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--gray2)}
.score-row{margin-bottom:10px}
.score-row-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.score-row-label span:first-child{font-weight:600;color:var(--gray5)}
.score-row-label span:last-child{color:var(--blue);font-weight:700}
.score-bar-bg{height:8px;background:var(--gray2);border-radius:4px;overflow:hidden}
.score-bar-fill{height:100%;background:linear-gradient(90deg,var(--blue-dark),var(--blue));border-radius:4px;transition:width .6s ease}
.total-score{margin-top:14px;padding-top:12px;border-top:2px solid var(--gray2);display:flex;justify-content:space-between;align-items:center}
.total-score-label{font-weight:700;font-size:14px}
.total-score-val{font-size:22px;font-weight:800;color:var(--blue)}

.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;color:#fff;display:inline-block;text-transform:uppercase;letter-spacing:.3px}
.badge-sedan{background:var(--badge-sedan)}
.badge-suv{background:var(--badge-suv)}
.badge-pickup{background:var(--badge-pickup)}
.badge-hatchback{background:var(--badge-hatchback)}
.badge-minivan{background:var(--badge-minivan)}
.badge-electrico{background:var(--badge-electrico)}

/* reliability pill */
.rel-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:10px}
.rel-5{background:#DCFCE7;color:#15803D}
.rel-4{background:#D1FAE5;color:#059669}
.rel-3{background:#FEF3C7;color:#D97706}
.rel-2{background:#FEE2E2;color:#DC2626}
.rel-1{background:#FEE2E2;color:#9F1239}

@media(max-width:768px){
  .header{padding:14px 12px 12px}
  .header h1{font-size:20px}
  .header p{font-size:12px}
  .header small{font-size:10px}
  .slots-section,.cta-wrap,#comparison-section,.score-section{padding:10px}
  .slot-info{padding:8px 10px}
  .slot-name{font-size:13px}
  .slot-price{font-size:14px}
  .slot-trim{font-size:10px}
  .slot-reliability{font-size:10px}
  .comp-table th,.comp-table td{padding:7px 8px;font-size:11px}
  .col-label{min-width:100px;font-size:10px}
  .col-vehicle{min-width:110px}
  .col-vehicle-header{min-width:110px;padding:8px 6px}
  .vehicle-col-name{font-size:11px}
  .vehicle-col-trim{font-size:9px}
  .vehicle-col-price{font-size:12px;margin-top:2px}
  .score-grid{grid-template-columns:1fr}
  .winner-card{padding:14px;gap:10px;flex-direction:column}
  .winner-trophy{font-size:32px}
  .winner-content h3{font-size:15px}
  .winner-content p{font-size:12px}
  .comparison-header h2,.score-header h2{font-size:17px}
  .btn-compare{font-size:15px;padding:14px 20px}
  .mini-chip{font-size:10px;padding:4px 7px}
  .mini-bar{gap:4px;padding:6px 10px}
  .btn-edit-sel{font-size:11px;padding:6px 10px}
  .filter-btn{font-size:11px;padding:5px 10px;min-height:32px}
}
@media(max-width:480px){
  .slot-img{height:75px;font-size:30px}
  .slot-controls{padding:8px}
  .slot-actions{padding:0 8px 8px}
  .slots-grid{gap:6px}
  .slots-section{padding:8px}
  .header h1{font-size:18px}
  .score-card{padding:14px}
}
@media print{
  .sticky-top,.btn-compare,.slot-actions,.filter-bar,.cta-wrap,.header small{display:none}
  body{background:#fff;font-size:12px}
  .table-wrap,.score-card,.winner-card{box-shadow:none;border:1px solid #ccc}
  #comparison-section,.score-section{padding:8px}
}
.table-overflow::-webkit-scrollbar{height:6px}
.table-overflow::-webkit-scrollbar-track{background:var(--gray2)}
.table-overflow::-webkit-scrollbar-thumb{background:var(--blue);border-radius:3px}
</style>
</head>
<body>

<header class="header">
  <div class="header-logo">
    <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><path d="M4 26 L8 14 Q9 11 12 11 L28 11 Q31 11 32 14 L36 26 Q37 28 36 29 L36 32 Q36 33 35 33 L31 33 Q30 33 30 32 L30 30 L10 30 L10 32 Q10 33 9 33 L5 33 Q4 33 4 32 L4 29 Q3 28 4 26Z M10 22 A3 3 0 1 0 16 22 A3 3 0 1 0 10 22Z M24 22 A3 3 0 1 0 30 22 A3 3 0 1 0 24 22Z M9 19 L12 13 L28 13 L31 19Z"/></svg>
    <h1>AutoCompara <span>MX</span> 🇲🇽</h1>
  </div>
  <p>Compara vehículos disponibles en México y toma la mejor decisión de compra</p>
  <small>Precios de lista oficiales en México · Modelos disponibles en agencias nacionales · 204 vehículos · 2025-2026 · Gasolina, Híbridos, PHEV y Eléctricos</small>
</header>

<div class="sticky-top">
  <div class="filter-bar">
    <div class="filter-row">
      <span class="filter-label">Categoría:</span>
      <div class="filter-group" id="cat-filters">
        <button class="filter-btn active" data-cat="Todos">Todos</button>
        <button class="filter-btn" data-cat="Sedán">Sedán</button>
        <button class="filter-btn" data-cat="SUV">SUV</button>
        <button class="filter-btn" data-cat="Pickup">Pickup</button>
        <button class="filter-btn" data-cat="Hatchback">Hatchback</button>
        <button class="filter-btn" data-cat="Minivan">Minivan</button>
        <button class="filter-btn" data-cat="Híbrido">🔋 Híbrido</button>
        <button class="filter-btn" data-cat="Eléctrico">⚡ Eléctrico</button>
      </div>
    </div>
    <div class="filter-row">
      <span class="filter-label">Precio:</span>
      <div class="filter-group" id="price-filters">
        <button class="filter-btn active" data-price="Todos">Todos</button>
        <button class="filter-btn" data-price="low">-$300k</button>
        <button class="filter-btn" data-price="mid">$300k–$600k</button>
        <button class="filter-btn" data-price="high">$600k–$900k</button>
        <button class="filter-btn" data-price="top">+$900k</button>
      </div>
    </div>
  </div>
  <div id="mini-bar" class="mini-bar"></div>
  <div class="slots-section" id="slots-section">
    <div class="slots-grid" id="slots-grid"></div>
  </div>
  <div class="cta-wrap" id="cta-wrap">
    <button class="btn-compare" id="btn-compare" disabled onclick="doCompare()">🔍 Comparar ahora</button>
  </div>
</div>

<div id="comparison-section" style="display:none"></div>
<div class="score-section" id="score-section" style="display:none"></div>

<script>

    fuel_economy_city:13.5, fuel_economy_highway:16.8,

  {

function relLabel(score){
  if(score>=5) return {cls:"rel-5",txt:"Muy alta"};
  if(score>=4) return {cls:"rel-4",txt:"Alta"};
  if(score>=3) return {cls:"rel-3",txt:"Media"};
  if(score>=2) return {cls:"rel-2",txt:"Baja"};
  return {cls:"rel-1",txt:"Muy baja"};
}

function isHybrid(v){
  const eng = (v.engine||"").toLowerCase();
  return eng.includes("híbrido") || eng.includes("phev") ||
         eng.includes("e-power") || eng.includes("e-tech") ||
         eng.includes("dht") || eng.includes("dm-i") ||
         eng.includes("mild hybrid") || eng.includes("48v");
}

function filteredVehicles(){
  return VEHICLES.filter(v=>{
    let catOk;
    if(filterCat==="Todos")    catOk = true;
    else if(filterCat==="Híbrido") catOk = isHybrid(v) && v.category!=="Eléctrico";
    else                       catOk = v.category===filterCat;
    let priceOk = true;
    if(filterPrice==="low")  priceOk = v.price_mxn < 300000;
    else if(filterPrice==="mid")  priceOk = v.price_mxn >= 300000 && v.price_mxn <= 600000;
    else if(filterPrice==="high") priceOk = v.price_mxn > 600000 && v.price_mxn <= 900000;
    else if(filterPrice==="top")  priceOk = v.price_mxn > 900000;
    return catOk && priceOk;
  });
}

async function loadCarImage(v, photoId) {
  const cacheKey = `${v.brand}_${v.model}`;
  if(wikiCache[cacheKey] !== undefined){
    if(wikiCache[cacheKey]) applyPhoto(photoId, wikiCache[cacheKey]);
    return;
  }
  const mapKey = `${v.brand} ${v.model}`;
  const terms = [...new Set([WIKI_MAP[mapKey], `${v.brand} ${v.model}`].filter(Boolean))];
  for(const term of terms){
    try{
      const ctrl = new AbortController();
      const tid = setTimeout(()=>ctrl.abort(), 6000);
      const res = await fetch(
        `https://en.wikipedia.org/w/api.php?action=query&prop=pageimages&format=json&pithumbsize=600&titles=${encodeURIComponent(term)}&origin=*`,
        {signal:ctrl.signal}
      );
      clearTimeout(tid);
      if(!res.ok) continue;
      const data = await res.json();
      const pages = data.query && data.query.pages;
      if(!pages) continue;
      const page = Object.values(pages)[0];
      if(page && page.thumbnail && page.thumbnail.source){
        wikiCache[cacheKey] = page.thumbnail.source;
        applyPhoto(photoId, page.thumbnail.source);
        return;
      }
    }catch(e){}
  }
  wikiCache[cacheKey] = null;
}

function applyPhoto(photoId, url){
  const img = document.getElementById(photoId);
  if(!img) return;
  const emojiId = photoId.replace('-photo-','-emoji-');
  img.onload = ()=>{
    img.style.opacity = '1';
    const em = document.getElementById(emojiId);
    if(em) em.style.opacity = '0';
  };
  img.onerror = ()=>{ img.style.display='none'; };
  img.src = url;
}

function loadAllSlotImages(){
  selectedVehicles.forEach((v,i)=>{ if(v) loadCarImage(v,`car-photo-${i}`); });
}

function loadCompareImages(vehicles){
  vehicles.forEach((v,i)=>{ loadCarImage(v,`comp-photo-${i}`); });
}

function renderSlots(){
  const grid = document.getElementById("slots-grid");
  grid.innerHTML = "";
  for(let i=0;i<4;i++){
    const v = selectedVehicles[i];
    const card = document.createElement("div");
    card.className = "slot-card";
    card.innerHTML = v ? renderSlotFilled(v,i) : renderSlotEmpty(i);
    grid.appendChild(card);
  }
  for(let i=0;i<4;i++) bindSlot(i);
  const count = selectedVehicles.filter(Boolean).length;
  const btn = document.getElementById("btn-compare");
  btn.disabled = count < 2;
  btn.textContent = count >= 2 ? `🔍 Comparar ${count} vehículos` : "🔍 Selecciona al menos 2 vehículos";
  loadAllSlotImages();
}

function closeAllDropdowns(){
  document.querySelectorAll(".slot-dropdown").forEach(d=>d.classList.remove("open"));
}

function positionDropdown(inp, drop){
  const rect = inp.getBoundingClientRect();
  const spaceBelow = window.innerHeight - rect.bottom;
  const spaceAbove = rect.top;
  const dropH = Math.min(260, window.innerHeight * 0.4);
  if(spaceBelow < dropH && spaceAbove > spaceBelow){
    drop.style.top = "auto";
    drop.style.bottom = "calc(100% + 4px)";
    drop.style.maxHeight = Math.min(spaceAbove - 12, 260) + "px";
  } else {
    drop.style.top = "calc(100% + 4px)";
    drop.style.bottom = "auto";
    drop.style.maxHeight = Math.min(spaceBelow - 12, 260) + "px";
  }
}

function bindSlot(i){
  const inp = document.getElementById(`search-${i}`);
  const drop = document.getElementById(`drop-${i}`);
  if(!inp || !drop) return;
  inp.addEventListener("focus", () => {
    closeAllDropdowns();
    populateDropdown(i,"");
    positionDropdown(inp, drop);
    drop.classList.add("open");
  });
  inp.addEventListener("input", () => {
    populateDropdown(i, inp.value);
    positionDropdown(inp, drop);
    drop.classList.add("open");
  });
  document.addEventListener("click", e => {
    if(!e.target.closest(`#wrap-${i}`)) drop.classList.remove("open");
  });
  document.addEventListener("touchstart", e => {
    if(!e.target.closest(`#wrap-${i}`)) drop.classList.remove("open");
  },{passive:true});
}

function populateDropdown(slotIdx, query){
  const drop = document.getElementById(`drop-${slotIdx}`);
  if(!drop) return;
  const q = query.toLowerCase();
  const usedIds = selectedVehicles.filter(Boolean).map(v=>v.id);
  const list = filteredVehicles().filter(v=>{
    if(usedIds.includes(v.id)) return false;
    return q==="" || `${v.brand} ${v.model} ${v.trim}`.toLowerCase().includes(q);
  }).sort((a,b)=>`${a.brand} ${a.model}`.localeCompare(`${b.brand} ${b.model}`, "es"));
  if(!list.length){ drop.innerHTML=`<div class="slot-opt" style="color:#6C757D">Sin resultados</div>`; return; }
  drop.innerHTML = list.map(v=>{
    const rel = relLabel(v.reliability_score);
    return `
    <div class="slot-opt" onclick="selectVehicle(${slotIdx},${v.id})">
      <span class="slot-opt-badge ${badgeClass(v.category)}">${v.category}</span>
      <span class="slot-opt-brand">${v.brand} ${v.model}</span>
      <span class="slot-opt-price">${fmt(v.price_mxn)}</span>
      <small style="color:#6C757D;display:block;font-size:11px;margin-top:2px">${v.year} ${v.trim} · Confiabilidad: <span class="${rel.cls}" style="font-weight:600">${rel.txt}</span></small>
    </div>`;
  }).join("");
}

function selectVehicle(slotIdx, vehicleId){
  selectedVehicles[slotIdx] = VEHICLES.find(v=>v.id===vehicleId);
  document.getElementById("comparison-section").style.display = "none";
  document.getElementById("score-section").style.display = "none";
  renderSlots();
}

function removeVehicle(slotIdx){
  selectedVehicles[slotIdx] = null;
  document.getElementById("comparison-section").style.display = "none";
  document.getElementById("score-section").style.display = "none";
  renderSlots();
}

});


function clearInvalidSlots(){
  selectedVehicles = selectedVehicles.map(v=>{
    if(!v) return null;
    return filteredVehicles().find(f=>f.id===v.id) ? v : null;
  });
}

function collapseSelector(){
  document.getElementById("slots-section").style.display = "none";
  document.getElementById("cta-wrap").style.display = "none";
  const bar = document.getElementById("mini-bar");
  const vehicles = selectedVehicles.filter(Boolean);
  bar.innerHTML = vehicles.map((v,i)=>{
    const realIdx = selectedVehicles.indexOf(v);
    return `<span class="mini-chip">
      <span class="badge ${badgeClass(v.category)}" style="font-size:9px;padding:2px 6px">${v.category}</span>
      ${v.brand} ${v.model}
      <span class="mini-remove" onclick="removeVehicle(${realIdx});expandSelector()">✕</span>
    </span>`;
  }).join("") + `<button class="btn-edit-sel" onclick="expandSelector()">✏️ Cambiar selección</button>`;
  bar.classList.add("visible");
}

function expandSelector(){
  document.getElementById("slots-section").style.display = "";
  document.getElementById("cta-wrap").style.display = "";
  document.getElementById("mini-bar").classList.remove("visible");
  document.getElementById("mini-bar").innerHTML = "";
  document.getElementById("comparison-section").style.display = "none";
  document.getElementById("score-section").style.display = "none";
  window.scrollTo({top:0, behavior:"smooth"});
}

// COMPARISON TABLE
// ─────────────────────────────────────────────
function doCompare(){
  const vehicles = selectedVehicles.filter(Boolean);
  if(vehicles.length < 2) return;

  const sec = document.getElementById("comparison-section");
  sec.style.display = "block";
  collapseSelector();

  function bestWorst(vals, lowerBetter=false){
    let bi=0, wi=0;
    vals.forEach((v,i)=>{
      if(v===null||v===0||v===undefined) return;
      if(lowerBetter){ if(v<vals[bi]) bi=i; if(v>vals[wi]) wi=i; }
      else { if(v>vals[bi]) bi=i; if(v<vals[wi]) wi=i; }
    });
    return {bi,wi};
  }

  function cellClass(vals, i, lowerBetter=false){
    const valid = vals.filter(v=>v!==null&&v!==undefined&&v!==0);
    if(valid.length < 2 || vals.every(v=>v===vals[0])) return "";
    const {bi,wi} = bestWorst(vals, lowerBetter);
    if(i===bi) return "best";
    if(i===wi) return "worst";
    return "";
  }

  const vhCols = vehicles.map((v,i)=>`
    <th class="col-vehicle-header" style="padding:0;vertical-align:top">
      <div style="position:relative;height:90px;overflow:hidden;background:${v.color}15;display:flex;align-items:center;justify-content:center">
        <span class="comp-car-emoji" id="comp-emoji-${i}">${carEmoji(v)}</span>
        <img id="comp-photo-${i}" src="" alt="${v.brand} ${v.model}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s ease">
      </div>
      <div style="padding:10px 8px 12px">
        <div class="vehicle-col-name">${v.brand} ${v.model}</div>
        <div class="vehicle-col-trim">${v.year} · ${v.trim}</div>
        <div class="vehicle-col-price">${fmt(v.price_mxn)}</div>
        <span class="badge ${badgeClass(v.category)}" style="margin-top:6px">${v.category}</span>
      </div>
    </th>`).join("");

  function row(label, vals, suffix="", lowerBetter=false){
    const tds = vehicles.map((_,i)=>{
      const val = vals[i];
      const display = (val===null||val===undefined) ? "—" : (suffix ? val+suffix : val);
      const c = cellClass(vals, i, lowerBetter);
      return `<td class="col-vehicle" style="text-align:center"><span class="${c}">${display}</span></td>`;
    }).join("");
    return `<tr><th class="col-label">${label}</th>${tds}</tr>`;
  }

  function textRow(label, vals){
    const tds = vals.map(v=>`<td class="col-vehicle" style="text-align:center">${v}</td>`).join("");
    return `<tr><th class="col-label">${label}</th>${tds}</tr>`;
  }

  function sectionHead(title){
    return `<tr><td class="section-header" colspan="${vehicles.length+1}" style="text-align:left">${title}</td></tr>`;
  }

  // Reliability cell with color pill
  const relRow = `<tr><th class="col-label">Confiabilidad</th>${vehicles.map((v,i)=>{
    const vals = vehicles.map(vv=>vv.reliability_score);
    const c = cellClass(vals, i);
    const r = relLabel(v.reliability_score);
    return `<td class="col-vehicle" style="text-align:center"><span class="${c}"><span class="rel-pill ${r.cls}">${stars(v.reliability_score)} ${r.txt}</span></span></td>`;
  }).join("")}</tr>`;

  // Maintenance cost row (lower = better)
  const maintRow = row("Mantenimiento anual", vehicles.map(v=>fmt(v.maintenance_cost_annual_mxn)), "", true);

  // Known issues row — nivel Alta/Media/Baja derivado de reliability_score
  function fallasNivel(score){
    if(score>=5) return {label:"Baja",cls:"best",icon:"✅"};
    if(score>=4) return {label:"Baja",cls:"best",icon:"✅"};
    if(score===3) return {label:"Media",cls:"mid-warn",icon:"⚠️"};
    if(score===2) return {label:"Alta",cls:"worst",icon:"🔴"};
    return {label:"Muy alta",cls:"worst",icon:"🔴"};
  }
  const relScores = vehicles.map(v=>v.reliability_score);
  const {bi:fBest, wi:fWorst} = bestWorst(relScores, false);
  const issuesRow = `<tr><th class="col-label">Nivel de fallas</th>${vehicles.map((v,i)=>{
    const fn = fallasNivel(v.reliability_score);
    const isBest = i===fBest && relScores.filter((s,j)=>s===relScores[i]&&j!==i).length<vehicles.length-1;
    const isWorst = i===fWorst && relScores.filter((s,j)=>s===relScores[i]&&j!==i).length<vehicles.length-1;
    const cls = relScores.every(s=>s===relScores[0]) ? fn.cls : (isBest?"best":isWorst?"worst":fn.cls);
    return `<td class="col-vehicle" style="text-align:center"><span class="${cls}" style="font-size:13px">${fn.icon} ${fn.label}</span></td>`;
  }).join("")}</tr>`;

  // Safety
  const safeRow = `<tr><th class="col-label">Seguridad LATINNCAP</th>${vehicles.map((v,i)=>{
    const vals = vehicles.map(vv=>vv.safety_rating);
    const c = cellClass(vals, i);
    return `<td class="col-vehicle" style="text-align:center"><span class="${c}"><span style="color:#FBBF24">${stars(v.safety_rating)}</span> (${v.safety_rating}/5)</span></td>`;
  }).join("")}</tr>`;

  sec.innerHTML = `
  <div class="comparison-header">
    <div>
      <h2>📊 Tabla Comparativa</h2>
      <div class="comparison-subtitle">Comparando ${vehicles.length} vehículos · <span style="color:var(--green);font-weight:600">Verde = mejor valor</span> · <span style="color:var(--red);font-weight:600">Rojo = menor valor</span></div>
    </div>
  </div>
  <div class="table-scroll-hint">← Desliza para ver todos los autos →</div>
  <div class="table-wrap">
    <div class="table-overflow">
      <table class="comp-table">
        <thead>
          <tr>
            <th class="col-label">Especificación</th>
            ${vhCols}
          </tr>
        </thead>
        <tbody>
          ${sectionHead("💰 Precio y Categoría")}
          ${row("Precio de lista", vehicles.map(v=>fmt(v.price_mxn)), "", true)}
          ${textRow("Categoría", vehicles.map(v=>`<span class="badge ${badgeClass(v.category)}">${v.category}</span>`))}
          ${textRow("Año / Versión", vehicles.map(v=>`<strong>${v.year}</strong><br><small>${v.trim}</small>`))}

          ${sectionHead("⚙️ Motor y Rendimiento")}
          ${textRow("Motor", vehicles.map(v=>v.engine))}
          ${row("Potencia", vehicles.map(v=>v.horsepower), " HP")}
          ${row("Torque", vehicles.map(v=>v.torque_nm), " Nm")}
          ${textRow("Transmisión", vehicles.map(v=>v.transmission))}
          ${textRow("Tracción", vehicles.map(v=>v.drivetrain))}
          ${row("Consumo ciudad", vehicles.map(v=>v.fuel_economy_city), " km/l")}
          ${row("Consumo carretera", vehicles.map(v=>v.fuel_economy_highway), " km/l")}

          ${sectionHead("📦 Capacidad y Practicidad")}
          ${row("Cajuela / Carga", vehicles.map(v=>v.cargo_volume_liters), " L")}
          ${row("Cap. arrastre", vehicles.map(v=>v.towing_capacity_kg), " kg")}
          ${row("Pasajeros", vehicles.map(v=>v.seating_capacity))}

          ${sectionHead("🛡️ Seguridad y Garantía")}
          ${safeRow}
          ${row("Garantía", vehicles.map(v=>v.warranty_years), " años")}

          ${sectionHead("🔧 Confiabilidad y Mantenimiento")}
          ${relRow}
          ${maintRow}
          ${issuesRow}

          ${sectionHead("✨ Equipamiento Destacado")}
          <tr><th class="col-label">Equipamiento</th>${vehicles.map(v=>`<td class="col-vehicle"><div class="tags">${v.key_features.map(f=>`<span class="tag">${f}</span>`).join("")}</div></td>`).join("")}</tr>

          ${sectionHead("👍 Ventajas y Desventajas")}
          <tr><th class="col-label">Ventajas</th>${vehicles.map(v=>`<td class="col-vehicle"><ul class="pros-list">${v.pros.map(p=>`<li>${p}</li>`).join("")}</ul></td>`).join("")}</tr>
          <tr><th class="col-label">Desventajas</th>${vehicles.map(v=>`<td class="col-vehicle"><ul class="cons-list">${v.cons.map(c=>`<li>${c}</li>`).join("")}</ul></td>`).join("")}</tr>

          ${sectionHead("🏢 Red de Distribuidores")}
          ${textRow("Cobertura", vehicles.map(v=>v.dealer_network))}
        </tbody>
      </table>
    </div>
  </div>`;

  renderScores(vehicles);
  loadCompareImages(vehicles);
  setTimeout(()=>sec.scrollIntoView({behavior:"smooth",block:"start"}), 100);
}

// ─────────────────────────────────────────────
// SCORING — 7 CRITERIOS
// ─────────────────────────────────────────────
function renderScores(vehicles){
  const sec = document.getElementById("score-section");
  sec.style.display = "block";

  function norm(val, min, max){ return max===min ? 70 : Math.round(((val-min)/(max-min))*100); }

  const criteria = [
    {key:"precio_valor",  label:"Relación Precio-Valor",   weight:0.18},
    {key:"seguridad",     label:"Seguridad",                weight:0.15},
    {key:"combustible",   label:"Eficiencia Combustible",   weight:0.14},
    {key:"practicidad",   label:"Practicidad",              weight:0.10},
    {key:"desempenio",    label:"Desempeño",                weight:0.15},
    {key:"confiabilidad", label:"Confiabilidad",            weight:0.18},
    {key:"mantenimiento", label:"Costo Mantenimiento",      weight:0.10},
  ];

  const raw = {
    precio_valor:  vehicles.map(v=>(v.key_features.length*5 + v.safety_rating*20 + v.warranty_years*10 + v.reliability_score*15) / v.price_mxn * 1000000),
    seguridad:     vehicles.map(v=>v.safety_rating * 20),
    combustible:   vehicles.map(v=>(v.fuel_economy_city + v.fuel_economy_highway) / 2),
    practicidad:   vehicles.map(v=>v.cargo_volume_liters / 10 + v.seating_capacity * 5),
    desempenio:    vehicles.map(v=>v.horsepower * 0.6 + v.torque_nm * 0.4),
    confiabilidad: vehicles.map(v=>v.reliability_score * 20),
    mantenimiento: vehicles.map(v=>v.maintenance_cost_annual_mxn),
  };

  const scores = vehicles.map((_,i)=>{
    const s = {};
    criteria.forEach(c=>{
      const vals = raw[c.key];
      const mn = Math.min(...vals), mx = Math.max(...vals);
      // mantenimiento: lower is better
      s[c.key] = c.key==="mantenimiento" ? norm(mx-(vals[i]-mn), 0, mx-mn) : norm(vals[i], mn, mx);
    });
    s.total = Math.round(criteria.reduce((acc,c)=>acc + s[c.key]*c.weight, 0));
    return s;
  });

  const winnerIdx = scores.reduce((bi,s,i)=>s.total>scores[bi].total?i:bi, 0);
  const winner = vehicles[winnerIdx];

  function useTags(v){
    const tags = [];
    if(v.seating_capacity >= 7) tags.push("Familia numerosa");
    if(v.fuel_economy_city > 13) tags.push("Ciudad eficiente");
    if(v.fuel_economy_highway > 16) tags.push("Carretera larga");
    if(v.drivetrain==="4x4"||v.drivetrain==="AWD") tags.push("Terreno difícil");
    if(v.price_mxn < 350000) tags.push("Primer auto");
    if(v.price_mxn < 310000) tags.push("Presupuesto ajustado");
    if(v.towing_capacity_kg > 1500) tags.push("Remolque pesado");
    if(v.horsepower > 200) tags.push("Alto desempeño");
    if(v.cargo_volume_liters > 550) tags.push("Maletero generoso");
    if(v.safety_rating === 5) tags.push("Máxima seguridad");
    if(v.reliability_score >= 5) tags.push("Máxima confiabilidad");
    if(v.maintenance_cost_annual_mxn <= 12000) tags.push("Bajo costo operación");
    return tags.slice(0,5);
  }

  function recParagraph(v, s){
    const rank = scores.filter(x=>x.total>s.total).length + 1;
    const suffix = ["primera","segunda","tercera"][rank-1]||"";
    let txt = `El <strong>${v.brand} ${v.model} ${v.trim}</strong> obtiene una puntuación global de <strong>${s.total}/100</strong>, posicionándolo como la ${suffix} opción en esta comparativa. `;
    const rel = relLabel(v.reliability_score);
    txt += `Su confiabilidad es <strong>${rel.txt}</strong> con un costo de mantenimiento anual estimado de <strong>${fmt(v.maintenance_cost_annual_mxn)}</strong>. `;
    if(s.desempenio >= 85) txt += `Su desempeño de ${v.horsepower} HP y ${v.torque_nm} Nm destaca en el grupo. `;
    if(s.combustible >= 85) txt += `La eficiencia de ${v.fuel_economy_city} km/l en ciudad es sobresaliente. `;
    if(s.seguridad >= 80) txt += `Con ${v.safety_rating} estrellas LATINNCAP tiene alta seguridad pasiva. `;
    if(s.precio_valor >= 85) txt += `Ofrece una relación precio-valor excepcional para el mercado mexicano. `;
    txt += `Garantía de ${v.warranty_years} año${v.warranty_years>1?"s":""} con distribuidores ${v.dealer_network.toLowerCase()}.`;
    return txt;
  }

  const scoreCards = vehicles.map((v,i)=>`
    <div class="score-card">
      <div class="score-card-name">
        ${i===winnerIdx?"🏆 ":""}${v.brand} ${v.model}
        <span class="badge ${badgeClass(v.category)}" style="float:right">${v.category}</span>
      </div>
      ${criteria.map(c=>`
        <div class="score-row">
          <div class="score-row-label"><span>${c.label}</span><span>${scores[i][c.key]}/100</span></div>
          <div class="score-bar-bg"><div class="score-bar-fill" style="width:${scores[i][c.key]}%"></div></div>
        </div>`).join("")}
      <div class="total-score">
        <span class="total-score-label">Puntuación total</span>
        <span class="total-score-val">${scores[i].total}/100</span>
      </div>
    </div>`).join("");

  sec.innerHTML = `
  <div class="score-header"><h2>🏆 Recomendación y Puntuación</h2></div>
  <div class="winner-card">
    <div class="winner-trophy">🏆</div>
    <div class="winner-content">
      <h3>${winner.brand} ${winner.model} ${winner.trim}</h3>
      <div class="winner-sub">${fmt(winner.price_mxn)} · ${winner.year} · Puntuación: ${scores[winnerIdx].total}/100</div>
      <p>${recParagraph(winner, scores[winnerIdx])}</p>
      <div class="use-tags">${useTags(winner).map(t=>`<span class="use-tag">✓ ${t}</span>`).join("")}</div>
    </div>
  </div>
  <div class="score-grid">${scoreCards}</div>`;
}

renderSlots();
</script>
</body>
</html>
